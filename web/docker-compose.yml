services:
  app:
    build:
      context: app
    image: ${DOCKER_USERNAME}/${CONTAINER_NAME}:${TAG}
    ports:
      - "8000"
    environment:
      - PI_BACKEND_URL=http://${PI_IP}:5001

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    ports:
      - "80:80"
