{% extends "base.html" %}
{% block content %}
<div class="grid cols-2">
  <section class="card">
    <div class="head">Loadcell Calibration</div>
    <div class="body">
      <div class="form-grid">
        <div><label class="subtle">Known weight (g)</label><input class="input" id="knownWeight" type="number" step="0.1" value="100"></div>
	<div><label class="subtle">Measured reading (g)</label><input class="input" id="measuredWeight" type="number" readonly placeholder=100.0></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
        <button class="btn primary" onclick="startLoadcellCalibration()">Start calibration</button>
        <button class="btn ghost" onclick="confirmLoadcellCalibration()">Confirm</button>
        <button class="btn ghost" onclick="cancelLoadcellCalibration()">Cancel</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="head">Thermocouple Calibration</div>
    <div class="body">
      <div class="form-grid">
	<div><label class="subtle">Reference temperature (°C)</label><input class="input" id="refTemp" type="number" readonly placeholder=25.0></div>
	<div><label class="subtle">Current reading (°C)</label><input class="input" id="currentTemp" type="number" readonly placeholder=24.2></div>
        <div><label class="subtle">Offset to apply (°C)</label><input class="input" id="calOffset" type="number" step="0.1" value="0.8"></div>
        <div><label class="subtle">Calibration status</label><input class="input" id="calStatus" type="text" readonly placeholder="Unknown"></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
        <button class="btn primary" onclick="checkThermocouple()">Check sensor</button>
        <button class="btn ghost" onclick="calibrateThermocouple()">Save offset</button>
      </div>
    </div>
  </section>
</div>
{% endblock %}
