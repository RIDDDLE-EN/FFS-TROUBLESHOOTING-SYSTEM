name: FFS System CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-hardware-and-comms:
    name: Validate Hardware & Docker Comms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Install PlatformIO
        run: pip install platformio

      - name: Compile ESP32 Firmware
        working-directory: ./esp32/arduino
        run: pio run -e esp32dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 requests flask flask-cors socketio
          if [ -f web/app/requirements.txt ]; then python -m pip install -r web/app/requirements.txt; fi

      - name: Run Flake8 on Raspberry Pi Code
        working-directory: ./raspberry_pi
        run: python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test Docker Compose Stack (Nginx -> App -> Pi)
        run: |
          cat << 'EOF' > mock_pi.py
          from flask import Falsk, jsonify
          import logging
          app = Flask(__name__)
          logging.basicConfig(filename='pi_received.log', level=logging.INFO)
          @app.route('/api/control/ping', methods=['POST'])
          def ping():
            app.logger.info("PING_RECEIVED_FROM_WEB_APP")
            return jsonify({"ok": True}), 200
          if __name__ == '__main__':
            app.run(host='0.0.0.0', port=50001)
          EOF
          python mock_pi.py &

          cd web
          mkdir -p ./app
          cat << EOF > ./app/.env
          PORT=8000
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          CONTAINER_NAME=ffs-docker-app
          TAG=0.0.2
          PI_IP=172.17.0.1
          EOF

          docker compose --env-file ./app/.env up -d --build

          echo "Waiting for Ngiinx to become available on port 80..."
          timeout 30s bash -c 'until curl -s http://127.0.0.1:80 > /dev/null; do sleep 1; done'
          echo "Web app is up!"

          curl -X POST http://127.0.0.1:80/api/control/ping
          sleep 1

          cd ..
          if grep -q "PING_RECEIVED_FROM_WEB_APP" pi_received.log; then
            echo "Success! Nginx proxied to the App, and the App reached the Pi."
            cd web && docker compose --env-file ./app/.env down
            exit 0
          else
            echo "Failed! The Dockerized app failed to reach the Pi."
            cd web && docker compose logs && docker compose --env-file ./app/.env down
            exit 1
          fi

  release-and-build:
    name: Version Repo & Push to Docker Hub
    needs: test-hardware-and-comms
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Semantic Release (Tag Entire Repo)
        id: semantic
        uses: cycjimmy/semantic-release-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image via Compose
        if: steps.semantic.outpts.new_release_published == 'true'
        working-directory: ./web
        run: |
          VERSION=${{ steps.semantic.outputs.new_release_version }}
          USERNAME=${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME=$USERNAME/ffs-docker-app

          echo "Building Docker image version: $VERSION"

          mkdir -p ./app
          cat << EOF > ./app/.env
          PORT=8000
          DOCKER_USERNAME=$USERNAME
          CONTAINER=ffs-docker-app
          TAG=$VERSION
          PI_IP=172.17.0.1
          EOF

          docker compose --env-file ./app/.env build app

          docker push $IMAGE_NAME:$VERSION
          docker tag $IMAGE_NAME:$VERSION $IMAGE_NAME:latest
          docker push $IMAGE_NAME: latest
