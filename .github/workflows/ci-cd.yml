name: FFS System CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    name: Detect Directory Changes
    runs-on: ubuntu-latest
    outputs:
      esp: ${{ steps.filter.outputs.esp }}
      pi: ${{ steps.filter.outputs.pi }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            esp:
              - 'esp32/arduino/**'
            pi:
              - 'raspberry_pi/**'
            web:
              - 'web/**'

  esp32-check:
    name: ESP32 Compile Verification
    needs: changes
    if: ${{ needs.changes.outputs.esp == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./esp32/arduino
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO Core, Toolchains & Packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/penv
            ./esp32/arduino/.pio
          key: ${{ runner.os }}-pio-full-${{ hashFiles('esp32/arduino/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-full-

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Compile ESP32 Firmware
        run: pio run -e esp32dev

  pi-check:
    name: Raspberry Pi Code Linting
    needs: changes
    if: ${{ needs.changes.outputs.pi == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./raspberry_pi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3

      - name: Fast Linting (Ruff)
        run: |
          uv pip install --system ruff
          ruff check .

  web-docker-test:
    name: Docker Comms Test (Nginx -> App -> Pi)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.pi == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests flask flask-cors socketio

      - name: Test Docker Compose Stack (Nginx -> App -> Pi)
        run: |
          cat << 'EOF' > mock_pi.py
          from flask import Flask, jsonify
          import logging
          app = Flask(__name__)
          logging.basicConfig(filename='pi_received.log', level=logging.INFO)
          @app.route('/api/control/ping', methods=['POST'])
          def ping():
            app.logger.info("PING_RECEIVED_FROM_WEB_APP")
            return jsonify({"ok": True}), 200
          if __name__ == '__main__':
            app.run(host='0.0.0.0', port=5001)
          EOF
          python mock_pi.py &

      - name: Test Docker Compose Stack
        working-directory: ./web
        run: |
          mkdir -p ./app

          RUNNER_IP=$(hostname -I | awk '{print $1}')

          cat << EOF > ./app/.env
          PORT=8000
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          CONTAINER_NAME=ffs-docker-app
          TAG=0.0.2
          PI_IP=$RUNNER_IP
          EOF

          docker compose --env-file ./app/.env up -d --build

          echo "Waiting for Nginx to become available on port 80..."
          timeout 30s bash -c 'until curl -s http://127.0.0.1:80 > /dev/null; do sleep 1; done'
          echo "Web app is up!"

          curl -X POST http://127.0.0.1:80/api/control/ping
          sleep 3

          cd ..
          if grep -q "PING_RECEIVED_FROM_WEB_APP" pi_received.log; then
            echo "Success! Nginx proxied to the App, and the App reached the Pi."
            cd web && docker compose --env-file ./app/.env down
            exit 0
          else
            echo "Failed! The Dockerized app failed to reach the Pi."
            cd web && docker compose logs && docker compose --env-file ./app/.env down
            exit 1
          fi

  release-and-build:
    name: Version Repo & Push to Docker Hub
    needs: [changes, esp32-check, pi-check, web-docker-test ]
    if: |
      always() &&
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' &&
      needs.esp32-check.result != 'failure' && needs.esp32-check.result != 'cancelled' &&
      needs.pi-check.result != 'failure' && needs.pi-check.result != 'cancelled' &&
      needs.web-docker-test.result != 'failure' && needs.web-docker-test.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Create Semantic Release Configuration
        run: |
          cat << 'EOF' > .releaserc.json
          {
            "branches": ["main"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              "@semantic-release/github"
            ]
          }
          EOF

      - name: Semantic Release (Tag Entire Repo)
        id: semantic
        uses: cycjimmy/semantic-release-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.semantic.outputs.new_release_published == 'true' && needs.changes.outputs.web == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image via Compose
        if: steps.semantic.outputs.new_release_published == 'true' && needs.changes.outputs.web == 'true'
        working-directory: ./web
        run: |
          VERSION=${{ steps.semantic.outputs.new_release_version }}
          USERNAME=${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME=$USERNAME/ffs-docker-app

          echo "Building Docker image version: $VERSION"

          mkdir -p ./app

          RUNNER_IP=$(hostname -I | awk '{print $1}')

          cat << EOF > ./app/.env
          PORT=8000
          DOCKER_USERNAME=$USERNAME
          CONTAINER_NAME=ffs-docker-app
          TAG=$VERSION
          PI_IP=$RUNNER_IP
          EOF

          docker compose --env-file ./app/.env build app

          docker push $IMAGE_NAME:$VERSION
          docker tag $IMAGE_NAME:$VERSION $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest
